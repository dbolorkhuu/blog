<!DOCTYPE html>
<html lang="{{ site.lang | default: 'mn' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{%- if page.description or site.description %}
<meta name="description" content="{{ page.description | default: site.description }}">
{%- endif %}
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
</head>
<body>

{% include header.html %}

<!-- Page bodies are Markdown, rendered in the browser by strapdown.js.
     They sit inside <xmp> so they reach the client unparsed: Jekyll runs Liquid
     on .html pages but not its Markdown converter, so the body stays raw.
     Keep the content tag below at column 0 - indenting it would turn the whole
     body into an indented Markdown code block. -->
<xmp theme="{{ page.theme | default: site.theme_default }}" style="display:none;">
{{ content }}
</xmp>

<script src="{{ '/edu/scripts/strapdown.js' | relative_url }}"></script>

{%- if page.math %}
<script>
  // Display math only. Single-$ inline math is deliberately NOT enabled: the
  // sample tables contain plain currency values like $1600 that would
  // otherwise be swallowed as TeX.
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{%- endif %}

</body>
</html>

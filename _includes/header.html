<div class="navbar navbar-fixed-top">
  <div class="navbar-inner">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <ul class="nav">
        {%- for item in site.nav %}
        <li{% if page.url == item.url %} class="active"{% endif %}><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </div>
  </div>
</div>
